name: Lote con la Max
run-name: "Lote ${{ inputs.lote || 'todos los activos' }} (${{ github.event_name == 'schedule' && 'cron' || 'lanzada' }})"
# Un jefe de lote trabajando ~5 h 20 por vuelta en una máquina de GitHub, con
# la suscripción Max del dueño: el secreto CLAUDE_CODE_OAUTH_TOKEN, que se crea
# en la PC con «MAX EN GITHUB.cmd» (corre `claude setup-token`; vale un año).
# Al terminar, cada lote lanza su vuelta siguiente si su letra sigue en
# .github/lotes-activos. Sin el secreto no arranca nada (el run avisa y ya).
# Para pararlo: quitar la letra de ese archivo (la vuelta en curso termina y
# no se lanza otra) o cancelar el run en la pestaña Actions.

on:
  workflow_dispatch:
    inputs:
      lote:
        description: "Letra del lote (vacío = todos los de .github/lotes-activos)"
        required: false
        default: ""
  schedule:
    # Red de seguridad por si una vuelta no encadena, y reintento cuando la
    # cuenta topa un límite largo: el cron de GitHub llega tarde, pero la
    # concurrencia impide que se pisen dos vueltas del mismo lote.
    - cron: "23 */3 * * *"

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lotes: ${{ steps.l.outputs.lotes }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - id: l
        env:
          PEDIDO: ${{ github.event.inputs.lote }}
          HAY_PASE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          activos=$(tr -cs 'A-Za-z' '\n' < .github/lotes-activos | tr a-z A-Z | grep -xE '[A-Z]' | sort -u || true)
          if [ -n "$PEDIDO" ]; then
            p=$(echo "$PEDIDO" | tr -d ' ' | tr a-z A-Z)
            lista=$(echo "$activos" | grep -x "$p" || true)
            [ -n "$lista" ] || echo "::warning::El lote $p no está en .github/lotes-activos: no lo lanzo."
          else
            lista="$activos"
          fi
          if [ -n "$lista" ] && [ "$HAY_PASE" != "true" ]; then
            echo "::warning::Falta el secreto CLAUDE_CODE_OAUTH_TOKEN: no lanzo ningún lote. En la PC: doble clic en «MAX EN GITHUB» (escritorio) y pega el pase."
            lista=""
          fi
          echo "lotes=$(echo "$lista" | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> "$GITHUB_OUTPUT"
          echo "activos: $(echo $activos) | esta vez: $(echo $lista)"

  lote:
    needs: plan
    if: needs.plan.outputs.lotes != '[]'
    strategy:
      fail-fast: false
      matrix:
        lote: ${{ fromJSON(needs.plan.outputs.lotes) }}
    concurrency:
      group: lote-${{ matrix.lote }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Herramientas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg tesseract-ocr tesseract-ocr-jpn tesseract-ocr-spa tmux
          pip3 install -q --user --break-system-packages -U "yt-dlp[default]" Pillow fontTools requests \
            faster-whisper scenedetect opencv-python-headless praat-parselmouth onnxruntime
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo mkdir -p /home/user
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/user/sintonizando-investigacion
          mkdir -p ~/.claude
          echo '{"theme":"dark","skipDangerousModePermissionPrompt":true}' > ~/.claude/settings.json
          python3 -c 'import json,os; json.dump({"hasCompletedOnboarding": True, "projects": {os.environ["GITHUB_WORKSPACE"]: {"hasTrustDialogAccepted": True}}}, open(os.path.expanduser("~/.claude.json"), "w"))'
          git config --global user.name "YinX (lote en GitHub)"
          git config --global user.email "226780449+9YinSk@users.noreply.github.com"

      - name: Jefe del lote ${{ matrix.lote }}
        run: bash herramientas/motor_github.sh "${{ matrix.lote }}"

      - name: Vuelta siguiente
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          L: ${{ matrix.lote }}
        run: |
          git fetch -q origin main
          if [ -f /tmp/lote-terminado ]; then
            # El lote acabó todas sus series: se quita solo de la lista para que
            # el cron no lo vuelva a lanzar (en una copia aparte de main).
            git worktree add -q /tmp/main origin/main
            sed -i "/^[[:space:]]*${L}[[:space:]]*$/Id" /tmp/main/.github/lotes-activos
            git -C /tmp/main add .github/lotes-activos
            git -C /tmp/main commit -q -m "Lote $L terminado: fuera de .github/lotes-activos" && git -C /tmp/main push -q origin HEAD:main || true
            echo "El lote $L terminó todas sus series."
            exit 0
          fi
          if [ ! -f /tmp/vuelta-ok ]; then
            echo "Esta vuelta no encadena otra (el motor dijo por qué); la red de seguridad lo reintenta cada 3 h."
            exit 0
          fi
          if git show origin/main:.github/lotes-activos | tr -cs 'A-Za-z' '\n' | tr a-z A-Z | grep -qx "$L"; then
            gh workflow run lote.yml --ref main -f lote="$L"
            echo "Lanzada la vuelta siguiente del lote $L"
          else
            echo "El lote $L ya no está en .github/lotes-activos: no sigo."
          fi
